# CI workflow for barcode-data-portal-mwlr
#
# Build Strategy:
# - On push to main: builds and pushes images to Artifactory
# - Automatically deploys to dev environment
# - Use promote.yml workflow manually to deploy to test/prod
#
# This workflow triggers a Bitbucket pipeline to update the GitOps repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # Cancel previous runs on new push

jobs:
  build:
    uses: manaakiwhenua/github-workflows/.github/workflows/docker-build.yml@8c2d28882e634fdcee7cbf0f4ceeddfae75a06f5 # v1.0.0
    with:
      bake_file: docker-bake.hcl
      bake_target: default
      # Pull requests build on a GitHub-hosted runner: they do not push, so they
      # need nothing from the internal network, and code from a fork never runs
      # inside the CI cluster (PE-663). Pushes keep the self-hosted runner, which
      # is what can reach the registry.
      runs_on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'tak-k8s-ci' }}
      push: ${{ github.event_name != 'pull_request' }}
      registry_host: ${{ vars.ARTIFACTORY_HOST }}
      registry_username: ${{ vars.ARTIFACTORY_USERNAME }}
    secrets:
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      REGISTRY_CA_CERT: ${{ secrets.REGISTRY_CA_CERT }}

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: k8s-dev
    steps:
      - name: Checkout for action
        uses: actions/checkout@v4
        with:
          repository: manaakiwhenua/github-workflows
          ref: 8c2d28882e634fdcee7cbf0f4ceeddfae75a06f5 # v1.0.0
          sparse-checkout: actions/k8s-deploy
          path: .github-workflows

      - name: Deploy to dev
        uses: ./.github-workflows/actions/k8s-deploy
        with:
          app_name: barcode-data-portal-mwlr
          environment: dev
          cluster: tak-k8s-nonprod
          build_key: ${{ needs.build.outputs.build_id }}
          bitbucket_token: ${{ secrets.K8S_APPS_CONFIG_TRIGGER_TOKEN }}

      - name: Deployment Summary
        run: |
          cat << SUMMARY >> $GITHUB_STEP_SUMMARY
          ## ✅ Dev Deployment Triggered
          
          | Property | Value |
          |----------|-------|
          | Build ID | \`${{ needs.build.outputs.build_id }}\` |
          | Environment | dev |
          | Cluster | tak-k8s-nonprod |
          
          The k8s-apps-config pipeline has updated the manifests and ArgoCD will sync shortly.
          
          ### Promote to Higher Environments
          
          To promote this build to **test** or **prod**, run the [Promote workflow](../../../actions/workflows/promote.yml) with build ID: \`${{ needs.build.outputs.build_id }}\`
          SUMMARY
